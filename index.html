
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS AI</title>
<style>
body {
  margin:0;
  padding:25px 15px;
  text-align:center;
  font-family:Arial;
  background:#061323;
  color:white;
}
h1 {color:#00d9ff}
.circle {
  width:150px;height:150px;
  border:4px solid #00d9ff;
  border-radius:50%;
  margin:35px auto;
  display:grid;place-items:center;
  box-shadow:0 0 25px #00d9ff;
}
input,button,select {
  padding:13px;margin:7px;
  border-radius:10px;
  background:#102b43;
  color:white;
  border:1px solid #00d9ff;
}
#answer {
  padding:15px;
  background:#102b43;
  border-radius:12px;
  margin-top:20px;
}
</style>
</head>
<body>
<h1>JARVIS AI</h1>
<p>Your Personal Assistant</p>
<div class="circle">JARVIS</div>

<select id="language">
<option value="hi-IN">हिंदी</option>
<option value="en-US">English</option>
</select>

<select id="voice">
<option value="male">Male Voice</option>
<option value="female">Female Voice</option>
</select>

<br>
<input id="question" placeholder="अपना सवाल लिखें">
<button onclick="ask()">Send</button>
<button onclick="listen()">🎤 Speak</button>

<div id="answer">नमस्ते! मैं JARVIS हूँ।</div>

<script>
function ask() {
 let q=document.getElementById("question").value;
 let lang=document.getElementById("language").value;
 let msg=lang==="hi-IN" ? "आपने कहा: " : "You said: ";
 document.getElementById("answer").innerText=
 q ? msg+q : "Please enter a message.";
}

function listen() {
 let S=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!S){alert("Voice recognition is not supported.");return;}
 let r=new S();
 r.lang=document.getElementById("language").value;
 r.onresult=e=>{
 document.getElementById("question").value=e.results[0][0].transcript;
 ask();
 };
 r.start();
}
</script>
</body>
</html>
